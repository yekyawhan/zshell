<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- y3kh (Aylin): Burmese must render with a real Unicode Myanmar font.
       Zawgyi-One (and other legacy encodings) stay installed, but they must
       never be auto-selected for Burmese - they garble Unicode text. -->

  <!-- 1) strip the "my" language claim from legacy Zawgyi fonts, so fontconfig
          stops ranking them as a Burmese font at all -->
  <match target="scan">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Zawgyi-One</string>
    </test>
    <edit name="lang" mode="assign" binding="same">
      <minus>
        <name>lang</name>
        <string>my</string>
      </minus>
    </edit>
  </match>

  <!-- 2) generic families fall back to Unicode Myanmar fonts -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Myanmar</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif Myanmar</family>
      <family>Noto Sans Myanmar</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Myanmar</family>
    </prefer>
  </alias>

  <!-- 3) any pattern that explicitly asks for Burmese gets Noto first, strong
          enough to beat fonts that still claim "my" -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>my</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans Myanmar</string>
    </edit>
  </match>
</fontconfig>