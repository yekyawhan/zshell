# ──────────────────────────────────────────────────────────────
#  y3kh / Aylin — tmux (Catppuccin Mocha, no plugins needed)
# ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-passthrough on
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
setw -g clock-mode-colour "#89b4fa"

# prefix: C-a (C-b still works as a secondary)
set -g prefix C-a
set -g prefix2 C-b
unbind C-b
bind C-a send-prefix

# splits / navigation that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind ^C copy-mode

# copy-mode vi-style yank to the system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ── status bar ───────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 42
set -g status-right-length 90
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#181825,fg=#89b4fa]"
set -g status-right "#[fg=#94e2d5] #(whoami)@#H #[fg=#45475a]│ #[fg=#f9e2af] %H:%M #[fg=#45475a]│ #[fg=#f5c2e7]#{?client_prefix, PREFIX ,} #[fg=#45475a]│ #[fg=#a6e3a1]%d-%b"
setw -g window-status-format "#[fg=#6c7086] #I #[fg=#bac2de]#W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I #W #[bg=#181825,fg=#89b4fa]"
setw -g window-status-separator ""

# ── panes / messages ─────────────────────────────────────────
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status off
set -g message-style "bg=#181825,fg=#f9e2af"
set -g message-command-style "bg=#181825,fg=#89b4fa"
set -g display-panes-colour "#89b4fa"
set -g display-panes-active-colour "#f5c2e7"
set -g status-bg "#181825"
# ── plugins (TPM) ────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh nvim vim lazygit btop zellij'
set -g @resurrect-dir '~/.tmux/resurrect'

run '~/.tmux/plugins/tpm/tpm'
